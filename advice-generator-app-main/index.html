<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Advice generator app</title>
</head>
<body>

  <main class="card">
    <p class="advice-id" id="advice-id">Advice #<span id="advice-number">...</span></p>

    <blockquote class="advice-text" id="advice-text">
      "Loading your advice..."
    </blockquote>

    <img src="./images/pattern-divider-desktop.svg" alt="" class="divider">

    <button class="dice-btn" id="dice-btn" aria-label="Get new advice">
      <img src="./images/icon-dice.svg" alt="">
    </button>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/COSPRO-DEV">Nwodo Tochukwu Benedict</a>.
  </footer>

  <script src="script.js"></script>
</body>
</html>
